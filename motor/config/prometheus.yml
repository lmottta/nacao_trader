# Configuração do Prometheus para monitoramento do Nação Trader
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'nacao-trader-monitor'
    environment: 'development'

# Configuração de regras de alerta
rule_files:
  - "alert_rules.yml"

# Configuração do Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Configuração de scraping
scrape_configs:
  # Métricas do próprio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /metrics

  # Métricas da aplicação Nação Trader
  - job_name: 'nacao-trader-app'
    static_configs:
      - targets: ['localhost:8000']  # Servidor de métricas da aplicação
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    honor_labels: true
    params:
      format: ['prometheus']

  # Métricas dos coletores de dados
  - job_name: 'nacao-trader-collectors'
    static_configs:
      - targets: ['localhost:8001']  # Servidor específico para coletores
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 15s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'collector_.*'
        target_label: component
        replacement: 'data_collector'

  # Métricas do sistema (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 30s
    metrics_path: /metrics

  # Métricas do Redis (se disponível)
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']
    scrape_interval: 30s
    metrics_path: /metrics

  # Push Gateway para métricas batch
  - job_name: 'pushgateway'
    static_configs:
      - targets: ['localhost:9091']
    scrape_interval: 30s
    honor_labels: true
    metrics_path: /metrics

# Configuração de armazenamento
storage:
  tsdb:
    path: /prometheus/data
    retention.time: 30d
    retention.size: 10GB
    wal-compression: true

# Configuração do servidor web
web:
  console.templates: /etc/prometheus/consoles
  console.libraries: /etc/prometheus/console_libraries
  enable-lifecycle: true
  enable-admin-api: true

# Configuração de logging
log:
  level: info
  format: logfmt